name: ucuenca-sabe
channels:
  - conda-forge
  - defaults
dependencies:
  # Lenguaje base (versión fija para reproducibilidad)
  - python=3.11.9

  # Core Data Processing (versiones fijas)
  - pandas=2.2.2
  - numpy=1.26.4
  - openpyxl=3.1.2
  - pyarrow
  - pyreadstat  # lectura de .sav (microdatos ENEMDU/INEC)

  # Scraping (investigacion_scraper_final.py, organizaciones_scraper.py)
  - selenium

  # Jupyter para VS Code (Quitamos el meta-paquete jupyter para aligerar)
  - ipykernel=6.29.4

  # Utilidades esenciales
  - python-dotenv=1.0.1
  - pyyaml=6.0.1

  # pip para paquetes no disponibles en conda
  - pip=24.0
  - pip:
    - kaggle>=2.2.4  # >=2.x requerido: soporta autenticación por KAGGLE_API_TOKEN (access token). La 1.5.16 solo lee KAGGLE_USERNAME/KAGGLE_KEY o kaggle.json y falla con tu .env actual.
