<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Empleabilidad ENEMDU + Sobrecalificación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.26.0/plotly.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [data-theme="dark"] { color-scheme: dark; }
        [data-theme="light"] { color-scheme: light; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="app"></div>

    <script>
        let dashboardData = null;
        let currentModule = null;

        // Configuración de colores UCuenca
        const colors = {
            navy: '#0B2341',
            red: '#D3272C',
            accent: '#1E4C82',
            light: '#F5F5F5',
            text: '#333333'
        };

        // Cargar datos JSON
        async function loadData() {
            try {
                const response = await fetch('static/data.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                dashboardData = await response.json();
                console.log('✅ Datos cargados:', dashboardData);
                renderLanding();
            } catch (error) {
                console.error('❌ Error cargando datos:', error);
                document.getElementById('app').innerHTML = `
                    <div class="flex items-center justify-center min-h-screen bg-red-50">
                        <div class="text-center p-8 bg-white rounded-lg shadow-lg">
                            <h1 class="text-2xl font-bold text-red-600 mb-4">⚠️ Error</h1>
                            <p class="text-gray-700 mb-4">No se pudo cargar static/data.json</p>
                            <p class="text-sm text-gray-500">${error.message}</p>
                        </div>
                    </div>
                `;
            }
        }

        // Vista Landing
        function renderLanding() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="min-h-screen flex flex-col items-center justify-center" style="background: linear-gradient(135deg, ${colors.navy} 0%, ${colors.accent} 100%);">
                    <div class="text-center text-white mb-12">
                        <h1 class="text-5xl font-bold mb-4">📊 Dashboard Empleabilidad</h1>
                        <p class="text-xl mb-2">Inteligencia Territorial | UCuenca-SABE</p>
                        <p class="text-gray-200">Datos ENEMDU 2021-2025</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-2xl mx-auto px-4 mb-12">
                        <button onclick="openModule('enemdu')" class="bg-white text-${colors.navy} px-8 py-6 rounded-lg font-bold text-lg hover:shadow-xl transform hover:scale-105 transition">
                            <div class="text-4xl mb-2">🏢</div>
                            Mercado Laboral ENEMDU
                        </button>
                        <button onclick="openModule('sobrecalificacion')" class="bg-white text-${colors.navy} px-8 py-6 rounded-lg font-bold text-lg hover:shadow-xl transform hover:scale-105 transition">
                            <div class="text-4xl mb-2">📚</div>
                            Sobrecalificación
                        </button>
                    </div>

                    <div class="text-gray-300 text-sm">
                        <p>Última actualización: ${new Date(dashboardData.metadata.timestamp).toLocaleDateString('es-EC')}</p>
                    </div>
                </div>
            `;
        }

        // Abrir módulo
        function openModule(moduleName) {
            if (moduleName === 'enemdu') renderEnemduModule('enemdu');
            else if (moduleName === 'sobrecalificacion') renderSobrecalificacionModule();
        }

        // Módulo ENEMDU / Empleabilidad Superior (mismo shape de datos, distinto segmento)
        function renderEnemduModule(moduleKey) {
            currentModule = moduleKey;
            const module = dashboardData.modules[moduleKey];
            const kpi = module.kpi_latest;
            const app = document.getElementById('app');
            const isGeneral = moduleKey === 'enemdu';

            app.innerHTML = `
                <div class="min-h-screen bg-gray-50">
                    <!-- Header -->
                    <div style="background: linear-gradient(135deg, ${colors.navy} 0%, ${colors.accent} 100%);" class="text-white p-6 shadow-lg">
                        <div class="max-w-6xl mx-auto flex items-center justify-between">
                            <div>
                                <h1 class="text-3xl font-bold">${module.title}</h1>
                                <p class="text-gray-200">Año: ${kpi.year} · Población: ${Math.round(kpi.poblacion).toLocaleString()}</p>
                            </div>
                            <button onclick="renderLanding()" class="bg-white text-${colors.navy} px-4 py-2 rounded font-bold hover:bg-gray-200">← Volver</button>
                        </div>
                    </div>

                    <div class="max-w-6xl mx-auto p-6">
                        <!-- Selector de segmento -->
                        <div class="flex gap-2 mb-6">
                            <button onclick="renderEnemduModule('enemdu')"
                                class="px-5 py-2 rounded-full font-bold text-sm transition ${isGeneral ? 'text-white' : 'bg-white text-gray-600 hover:bg-gray-100'}"
                                style="${isGeneral ? `background:${colors.navy}` : ''}">
                                🌎 Toda la PEA
                            </button>
                            <button onclick="renderEnemduModule('empleabilidad_superior')"
                                class="px-5 py-2 rounded-full font-bold text-sm transition ${!isGeneral ? 'text-white' : 'bg-white text-gray-600 hover:bg-gray-100'}"
                                style="${!isGeneral ? `background:${colors.navy}` : ''}">
                                🎓 Educación Superior
                            </button>
                        </div>

                        <!-- KPIs -->
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                            <div class="bg-white p-6 rounded-lg shadow text-center">
                                <div class="text-3xl font-bold text-red-600">${kpi.tasa_desempleo.toFixed(1)}%</div>
                                <p class="text-gray-600 mt-2">Tasa Desempleo</p>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow text-center">
                                <div class="text-3xl font-bold text-green-600">${kpi.tasa_empleo_adecuado.toFixed(1)}%</div>
                                <p class="text-gray-600 mt-2">Empleo Adecuado</p>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow text-center">
                                <div class="text-3xl font-bold text-blue-600">$${kpi.ingreso_laboral_medio.toFixed(0)}</div>
                                <p class="text-gray-600 mt-2">Ingreso Laboral</p>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow text-center">
                                <div class="text-3xl font-bold text-purple-600">${kpi.n_muestral.toLocaleString()}</div>
                                <p class="text-gray-600 mt-2">Muestra</p>
                            </div>
                        </div>

                        <!-- Gráficos -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-4">Evolución 2021-2025</h3>
                                <div id="timeline-chart" style="height: 300px;"></div>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-4">Top 10 Provincias por Desempleo</h3>
                                <div id="provincia-chart" style="height: 300px;"></div>
                            </div>
                        </div>

                        <!-- Tabla Provincias -->
                        <div class="bg-white p-6 rounded-lg shadow">
                            <h3 class="text-lg font-bold mb-4">Detalle por Provincia (${kpi.year})</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm">
                                    <thead class="bg-gray-100">
                                        <tr>
                                            <th class="px-4 py-2 text-left">Provincia</th>
                                            <th class="px-4 py-2 text-right">Desempleo %</th>
                                            <th class="px-4 py-2 text-right">Empleo Adecuado %</th>
                                            <th class="px-4 py-2 text-right">Ingreso Laboral</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${module.por_provincia.slice(0, 15).map(p => `
                                            <tr class="border-b hover:bg-gray-50">
                                                <td class="px-4 py-2">${p.provincia}</td>
                                                <td class="px-4 py-2 text-right">${p.tasa_desempleo.toFixed(1)}%</td>
                                                <td class="px-4 py-2 text-right">${p.tasa_empleo_adecuado.toFixed(1)}%</td>
                                                <td class="px-4 py-2 text-right">$${p.ingreso_laboral_medio.toFixed(0)}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Brecha de género -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-8">
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-4">Brecha de Género en Desempleo (${kpi.year})</h3>
                                <p class="text-xs text-gray-500 mb-2">Puntos porcentuales, Mujer − Hombre, por grupo etario</p>
                                <div id="brecha-genero-chart" style="height: 280px;"></div>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-4">Desempleo por Sexo y Edad</h3>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-sm">
                                        <thead class="bg-gray-100">
                                            <tr>
                                                <th class="px-3 py-2 text-left">Grupo etario</th>
                                                <th class="px-3 py-2 text-right">Hombres %</th>
                                                <th class="px-3 py-2 text-right">Mujeres %</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${[...new Set(module.por_sexo_edad.map(r => r.grupo_edad))].map(grupo => {
                                                const h = module.por_sexo_edad.find(r => r.grupo_edad === grupo && r.sexo === 'Hombre');
                                                const m = module.por_sexo_edad.find(r => r.grupo_edad === grupo && r.sexo === 'Mujer');
                                                return `
                                                <tr class="border-b hover:bg-gray-50">
                                                    <td class="px-3 py-2">${grupo}</td>
                                                    <td class="px-3 py-2 text-right">${h ? h.tasa_desempleo.toFixed(1) : '—'}%</td>
                                                    <td class="px-3 py-2 text-right">${m ? m.tasa_desempleo.toFixed(1) : '—'}%</td>
                                                </tr>`;
                                            }).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        ${module.por_nivel_instruccion ? `
                        <!-- Por nivel de instrucción -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-8">
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-4">Desempleo por Nivel de Instrucción (${kpi.year})</h3>
                                <div id="nivel-instruccion-chart" style="height: 320px;"></div>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-4">Detalle por Nivel de Instrucción</h3>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-sm">
                                        <thead class="bg-gray-100">
                                            <tr>
                                                <th class="px-3 py-2 text-left">Nivel</th>
                                                <th class="px-3 py-2 text-right">Desempleo %</th>
                                                <th class="px-3 py-2 text-right">Empleo Adec. %</th>
                                                <th class="px-3 py-2 text-right">Sobrecalif. %</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${module.por_nivel_instruccion.map(n => `
                                                <tr class="border-b hover:bg-gray-50">
                                                    <td class="px-3 py-2">${n.nivel_instruccion}</td>
                                                    <td class="px-3 py-2 text-right">${n.tasa_desempleo.toFixed(1)}%</td>
                                                    <td class="px-3 py-2 text-right">${n.tasa_empleo_adecuado.toFixed(1)}%</td>
                                                    <td class="px-3 py-2 text-right">${n.tasa_sobrecalificacion !== null ? n.tasa_sobrecalificacion.toFixed(1) + '%' : '—'}</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>` : ''}
                    </div>
                </div>
            `;

            // Dibujar gráficos
            setTimeout(() => {
                drawTimelineChart(moduleKey);
                drawProvinciaChart(moduleKey);
                drawBrechaGeneroChart(moduleKey);
                if (module.por_nivel_instruccion) drawNivelInstruccionChart(moduleKey);
            }, 100);
        }

        // Módulo Sobrecalificación
        function renderSobrecalificacionModule() {
            const module = dashboardData.modules.sobrecalificacion;
            const kpi = module.tasa_general_por_anio;
            const app = document.getElementById('app');

            app.innerHTML = `
                <div class="min-h-screen bg-gray-50">
                    <!-- Header -->
                    <div style="background: linear-gradient(135deg, ${colors.navy} 0%, ${colors.accent} 100%);" class="text-white p-6 shadow-lg">
                        <div class="max-w-6xl mx-auto flex items-center justify-between">
                            <div>
                                <h1 class="text-3xl font-bold">${module.title}</h1>
                                <p class="text-gray-200">Graduados en ocupaciones no acordes a su formación</p>
                            </div>
                            <button onclick="renderLanding()" class="bg-white text-${colors.navy} px-4 py-2 rounded font-bold hover:bg-gray-200">← Volver</button>
                        </div>
                    </div>

                    <!-- KPI Principal -->
                    <div class="max-w-6xl mx-auto p-6">
                        <div class="bg-white p-8 rounded-lg shadow text-center mb-8">
                            <div class="text-5xl font-bold text-red-600">${kpi.tasa_sobrecalificacion[kpi.tasa_sobrecalificacion.length - 1].toFixed(1)}%</div>
                            <p class="text-gray-600 mt-2 text-lg">Tasa de Sobrecalificación (2025)</p>
                        </div>

                        <!-- Gráficos -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-4">Evolución 2021-2025</h3>
                                <div id="sobrecal-timeline-chart" style="height: 300px;"></div>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-4">Por Ocupación (CIUO-08)</h3>
                                <div id="ocupacion-chart" style="height: 300px;"></div>
                            </div>
                        </div>

                        <!-- Tabla Ocupaciones -->
                        <div class="bg-white p-6 rounded-lg shadow">
                            <h3 class="text-lg font-bold mb-4">Detalle por Ocupación</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm">
                                    <thead class="bg-gray-100">
                                        <tr>
                                            <th class="px-4 py-2 text-left">Ocupación (CIUO-08)</th>
                                            <th class="px-4 py-2 text-right">% Graduados Ocupados</th>
                                            <th class="px-4 py-2 text-center">¿Sobrecalificado?</th>
                                            <th class="px-4 py-2 text-right">Ocupados Totales</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${module.por_ocupacion_2025.map(o => `
                                            <tr class="border-b hover:bg-gray-50">
                                                <td class="px-4 py-2">${o.ocupacion}</td>
                                                <td class="px-4 py-2 text-right">${o.participacion_pct.toFixed(1)}%</td>
                                                <td class="px-4 py-2 text-center">${o.sobrecalificado ? '⚠️ Sí' : '—'}</td>
                                                <td class="px-4 py-2 text-right">${o.ocupados_totales.toLocaleString()}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Dibujar gráficos
            setTimeout(() => {
                drawSobrecalTimelineChart();
                drawOcupacionChart();
            }, 100);
        }

        // Gráficos
        function drawTimelineChart(moduleKey) {
            const timeline = dashboardData.modules[moduleKey].timeline;
            const trace1 = {
                x: timeline.years,
                y: timeline.tasa_desempleo,
                name: 'Tasa Desempleo %',
                type: 'scatter',
                mode: 'lines+markers',
                line: { color: colors.red, width: 3 }
            };
            const trace2 = {
                x: timeline.years,
                y: timeline.tasa_empleo_adecuado,
                name: 'Empleo Adecuado %',
                type: 'scatter',
                mode: 'lines+markers',
                line: { color: colors.accent, width: 3 }
            };
            Plotly.newPlot('timeline-chart', [trace1, trace2], { 
                margin: { l: 50, r: 20, t: 20, b: 30 },
                hovermode: 'x unified'
            }, { responsive: true });
        }

        function drawProvinciaChart(moduleKey) {
            const provincias = dashboardData.modules[moduleKey].por_provincia.slice(0, 10).reverse();
            const trace = {
                x: provincias.map(p => p.tasa_desempleo),
                y: provincias.map(p => p.provincia),
                type: 'bar',
                orientation: 'h',
                marker: { color: colors.red }
            };
            Plotly.newPlot('provincia-chart', [trace], {
                margin: { l: 150, r: 20, t: 20, b: 30 },
                xaxis: { title: 'Tasa Desempleo %' }
            }, { responsive: true });
        }

        function drawBrechaGeneroChart(moduleKey) {
            // Un valor de brecha_desempleo_pp por grupo_edad (viene repetido en
            // Hombre y Mujer del mismo grupo; nos quedamos con uno solo).
            const porSexoEdad = dashboardData.modules[moduleKey].por_sexo_edad;
            const grupos = [...new Set(porSexoEdad.map(r => r.grupo_edad))];
            const brechas = grupos.map(g => {
                const row = porSexoEdad.find(r => r.grupo_edad === g && r.brecha_desempleo_pp !== null);
                return row ? row.brecha_desempleo_pp : 0;
            });
            const trace = {
                x: grupos,
                y: brechas,
                type: 'bar',
                marker: { color: brechas.map(b => b >= 0 ? colors.red : colors.accent) }
            };
            Plotly.newPlot('brecha-genero-chart', [trace], {
                margin: { l: 50, r: 20, t: 20, b: 30 },
                yaxis: { title: 'p.p. (Mujer − Hombre)', zeroline: true },
                shapes: [{ type: 'line', x0: -0.5, x1: grupos.length - 0.5, y0: 0, y1: 0,
                          line: { color: '#999', width: 1 } }]
            }, { responsive: true });
        }

        function drawNivelInstruccionChart(moduleKey) {
            const niveles = dashboardData.modules[moduleKey].por_nivel_instruccion;
            const trace = {
                x: niveles.map(n => n.nivel_instruccion),
                y: niveles.map(n => n.tasa_desempleo),
                type: 'bar',
                marker: { color: colors.accent }
            };
            Plotly.newPlot('nivel-instruccion-chart', [trace], {
                margin: { l: 50, r: 20, t: 20, b: 100 },
                yaxis: { title: 'Tasa Desempleo %' },
                xaxis: { tickangle: -35 }
            }, { responsive: true });
        }

        function drawSobrecalTimelineChart() {
            const tasa = dashboardData.modules.sobrecalificacion.tasa_general_por_anio;
            const trace = {
                x: tasa.years,
                y: tasa.tasa_sobrecalificacion,
                name: 'Tasa Sobrecalificación %',
                type: 'scatter',
                mode: 'lines+markers',
                line: { color: colors.red, width: 3 },
                fill: 'tozeroy',
                fillcolor: 'rgba(211, 39, 44, 0.2)'
            };
            Plotly.newPlot('sobrecal-timeline-chart', [trace], { 
                margin: { l: 50, r: 20, t: 20, b: 30 },
                hovermode: 'x unified'
            }, { responsive: true });
        }

        function drawOcupacionChart() {
            const ocupaciones = dashboardData.modules.sobrecalificacion.por_ocupacion_2025.slice(0, 8).reverse();
            const trace = {
                x: ocupaciones.map(o => o.participacion_pct),
                y: ocupaciones.map(o => o.ocupacion),
                type: 'bar',
                orientation: 'h',
                marker: { color: ocupaciones.map(o => o.sobrecalificado ? colors.red : colors.accent) }
            };
            Plotly.newPlot('ocupacion-chart', [trace], { 
                margin: { l: 150, r: 20, t: 20, b: 30 },
                xaxis: { title: 'Tasa Sobrecalificación %' }
            }, { responsive: true });
        }

        // Iniciar
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
