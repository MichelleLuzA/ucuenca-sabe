<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Empleabilidad ENEMDU + Sobrecalificación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.26.0/plotly.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [data-theme="dark"] { color-scheme: dark; }
        [data-theme="light"] { color-scheme: light; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="app"></div>

    <script>
        let dashboardData = null;
        let currentModule = null;

        // Configuración de colores UCuenca
        const colors = {
            navy: '#0B2341',
            red: '#D3272C',
            accent: '#1E4C82',
            light: '#F5F5F5',
            text: '#333333'
        };

        // Cargar datos JSON
        async function loadData() {
            try {
                const response = await fetch('static/data.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                dashboardData = await response.json();
                prepararCubos();
                renderLanding();
            } catch (error) {
                console.error('❌ Error cargando datos:', error);
                document.getElementById('app').innerHTML = `
                    <div class="flex items-center justify-center min-h-screen bg-red-50">
                        <div class="text-center p-8 bg-white rounded-lg shadow-lg">
                            <h1 class="text-2xl font-bold text-red-600 mb-4">⚠️ Error</h1>
                            <p class="text-gray-700 mb-4">No se pudo cargar static/data.json</p>
                            <p class="text-sm text-gray-500">${error.message}</p>
                        </div>
                    </div>
                `;
            }
        }

        // Vista Landing
        function renderLanding() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="min-h-screen flex flex-col items-center justify-center" style="background: linear-gradient(135deg, ${colors.navy} 0%, ${colors.accent} 100%);">
                    <div class="text-center text-white mb-12">
                        <h1 class="text-5xl font-bold mb-4">📊 Dashboard Empleabilidad</h1>
                        <p class="text-xl mb-2">Inteligencia Territorial | UCuenca-SABE</p>
                        <p class="text-gray-200">Datos ENEMDU 2021-2025</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-2xl mx-auto px-4 mb-12">
                        <button onclick="openModule('enemdu')" style="color:${colors.navy}" class="bg-white px-8 py-6 rounded-lg font-bold text-lg hover:shadow-xl transform hover:scale-105 transition">
                            <div class="text-4xl mb-2">🏢</div>
                            Mercado Laboral ENEMDU
                        </button>
                        <button onclick="openModule('sobrecalificacion')" style="color:${colors.navy}" class="bg-white px-8 py-6 rounded-lg font-bold text-lg hover:shadow-xl transform hover:scale-105 transition">
                            <div class="text-4xl mb-2">📚</div>
                            Sobrecalificación
                        </button>
                    </div>

                    <div class="text-gray-300 text-sm">
                        <p>Última actualización: ${new Date(dashboardData.metadata.timestamp).toLocaleDateString('es-EC')}</p>
                    </div>

                    <div class="mt-10 pt-4 border-t border-white/20 text-center text-xs text-gray-300">
                        Elaborado por <span class="font-semibold text-white">Econ. Michelle Luzuriaga</span> · Dirección de Proyectos Estratégicos · Universidad de Cuenca
                    </div>
                </div>
            `;
        }

        // Abrir módulo
        function openModule(moduleName) {
            if (moduleName === 'enemdu') renderEnemduModule('enemdu');
            else if (moduleName === 'sobrecalificacion') renderSobrecalificacionModule();
        }

        // ------------------------------------------------------------------
        // Cubos aditivos (gold: cubo_empleabilidad, cubo_ocupacion_graduados).
        // Toda cifra se recalcula aquí sumando las filas que pasan los filtros
        // y aplicando las fórmulas de ENEMDUGoldBuilder._rates: las tasas no se
        // promedian, las sumas ponderadas sí.
        // ------------------------------------------------------------------
        const SEXOS = ['Hombre', 'Mujer'];
        const SEXO_COLOR = { Hombre: '#1E4C82', Mujer: '#C0417A' };
        const filtrosEmp = { sexo: 'Todos', nivel: 'Todos' };
        const filtrosSob = { sexo: 'Todos', provincia: 'Todas' };
        let cubo = [], cuboOcup = [], ANIOS = [], ULTIMO = null, N_MIN = 30;

        function desempacar(c) {
            return c.rows.map(r => Object.fromEntries(c.cols.map((k, i) => [k, r[i]])));
        }

        function prepararCubos() {
            const c = dashboardData.cubos;
            cubo = desempacar(c.empleabilidad);
            cuboOcup = desempacar(c.ocupacion_graduados);
            ANIOS = [...new Set(cubo.map(r => r.anio))].sort();
            ULTIMO = ANIOS[ANIOS.length - 1];
            N_MIN = c.n_minimo;
        }

        function filtrar(rows, f) {
            return rows.filter(r =>
                (!f.graduados || r.es_graduado_superior)
                && (!f.sexo || f.sexo === 'Todos' || r.sexo === f.sexo)
                && (!f.nivel || f.nivel === 'Todos' || r.nivel_instruccion === f.nivel)
                && (!f.provincia || f.provincia === 'Todas' || r.provincia === f.provincia)
                && (!f.grupo_edad || r.grupo_edad === f.grupo_edad)
                && (f.anio === undefined || r.anio === f.anio));
        }

        const CAMPOS = ['n_muestral', 'poblacion', 'pea', 'ocupados', 'desempleados', 'empleo_adecuado',
                        'sobrecalificados', 'ocupados_con_ciuo', 'ingreso_pond', 'peso_ingreso'];
        function metricas(rows) {
            const s = Object.fromEntries(CAMPOS.map(k => [k, 0]));
            rows.forEach(r => CAMPOS.forEach(k => { s[k] += r[k] || 0; }));
            const pct = (a, b) => b ? 100 * a / b : null;
            return {
                n: s.n_muestral, poblacion: s.poblacion,
                desempleo: pct(s.desempleados, s.pea),
                adecuado: pct(s.empleo_adecuado, s.pea),
                sobrecal: pct(s.sobrecalificados, s.ocupados_con_ciuo),
                ingreso: s.peso_ingreso ? s.ingreso_pond / s.peso_ingreso : null
            };
        }
        const m = (rows, f) => metricas(filtrar(rows, f));
        // Celdas con muy pocas observaciones muestrales no se grafican (mismo umbral que gold)
        const val = (met, k) => met.n >= N_MIN ? met[k] : null;
        const fmt = (x, d = 1) => x == null ? '—' : x.toFixed(d);
        const seriesSexo = sexo => sexo === 'Todos' ? SEXOS : [sexo];

        function selectHtml(label, opciones, valor, onchange) {
            return `<label class="text-sm text-gray-600 flex items-center gap-2">${label}
                <select onchange="${onchange}" class="border border-gray-300 rounded px-2 py-1 bg-white text-gray-900">
                    ${opciones.map(([v, t]) => `<option value="${v}" ${v === valor ? 'selected' : ''}>${t}</option>`).join('')}
                </select></label>`;
        }
        const OPC_SEXO = [['Todos', 'Todos (desagregado por sexo)'], ['Hombre', 'Hombres'], ['Mujer', 'Mujeres']];

        // KPI con su desagregación por sexo debajo cuando no hay filtro de sexo
        function kpiHtml(valor, etiqueta, colorCls, porSexo) {
            return `<div class="bg-white p-6 rounded-lg shadow text-center">
                <div class="text-3xl font-bold ${colorCls}">${valor}</div>
                <p class="text-gray-600 mt-2">${etiqueta}</p>
                ${porSexo ? `<p class="text-xs mt-2">${porSexo.map(([s, v]) =>
                    `<span style="color:${SEXO_COLOR[s]}">${s === 'Hombre' ? 'Hombres' : 'Mujeres'} ${v}</span>`).join(' · ')}</p>` : ''}
            </div>`;
        }

        function headerHtml(titulo, subtitulo) {
            return `<div style="background: linear-gradient(135deg, ${colors.navy} 0%, ${colors.accent} 100%);" class="text-white p-6 shadow-lg">
                <div class="max-w-6xl mx-auto flex items-center justify-between">
                    <div>
                        <h1 class="text-3xl font-bold">${titulo}</h1>
                        <p class="text-gray-200">${subtitulo}</p>
                    </div>
                    <button onclick="renderLanding()" class="bg-white px-4 py-2 rounded font-bold hover:bg-gray-200" style="color:${colors.navy}">← Volver</button>
                </div>
            </div>`;
        }

        function footerHtml() {
            const fecha = new Date(dashboardData.metadata.timestamp).toLocaleDateString('es-EC');
            return `<footer class="border-t-2 mt-10" style="border-color:${colors.navy}">
                <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col md:flex-row md:justify-between gap-1 text-xs text-gray-500">
                    <span>Elaborado por <strong style="color:${colors.navy}">Econ. Michelle Luzuriaga</strong> · Dirección de Proyectos Estratégicos · Universidad de Cuenca</span>
                    <span>Fuente: INEC, ENEMDU ${ANIOS[0]}–${ULTIMO} · Actualizado ${fecha}</span>
                </div>
            </footer>`;
        }

        const notaN = () => `<p class="text-xs text-gray-400 mt-2">† Menos de ${N_MIN} observaciones muestrales: cifra poco precisa (se omite en los gráficos).</p>`;

        // Módulo ENEMDU / Empleabilidad Superior (mismo cubo, distinto segmento)
        function renderEnemduModule(moduleKey) {
            currentModule = moduleKey;
            const module = dashboardData.modules[moduleKey];
            const isGeneral = moduleKey === 'enemdu';
            const orden = dashboardData.cubos.nivel_instruccion_orden;
            const niveles = orden.filter(n => cubo.some(r => r.nivel_instruccion === n && (isGeneral || r.es_graduado_superior)));
            if (!niveles.includes(filtrosEmp.nivel)) filtrosEmp.nivel = 'Todos';

            const base = { graduados: !isGeneral, sexo: filtrosEmp.sexo, nivel: filtrosEmp.nivel };
            const kpi = m(cubo, { ...base, anio: ULTIMO });
            const kpiSexo = filtrosEmp.sexo === 'Todos'
                ? SEXOS.map(s => [s, m(cubo, { ...base, sexo: s, anio: ULTIMO })]) : null;
            const sub = (k, f) => kpiSexo && kpiSexo.map(([s, met]) => [s, f(met[k])]);

            const provincias = [...new Set(cubo.map(r => r.provincia))]
                .map(p => ({ provincia: p, ...m(cubo, { ...base, provincia: p, anio: ULTIMO }) }))
                .sort((a, b) => (b.desempleo ?? -1) - (a.desempleo ?? -1));
            const grupos = dashboardData.cubos.grupo_edad_orden;
            const sexoEdad = grupos.map(g => ({
                grupo: g,
                Hombre: m(cubo, { ...base, sexo: 'Hombre', grupo_edad: g, anio: ULTIMO }),
                Mujer: m(cubo, { ...base, sexo: 'Mujer', grupo_edad: g, anio: ULTIMO })
            }));
            const porNivel = niveles.map(n => ({ nivel: n, ...m(cubo, { ...base, nivel: n, anio: ULTIMO }) }));
            const celda = (met, k, d, pre = '', suf = '%') =>
                `${met.n < N_MIN ? '<span class="text-gray-400">' : '<span>'}${met[k] == null ? '—' : pre + met[k].toFixed(d) + suf}${met.n < N_MIN ? ' †' : ''}</span>`;

            const filtroTxt = [filtrosEmp.sexo !== 'Todos' ? (filtrosEmp.sexo === 'Hombre' ? 'Hombres' : 'Mujeres') : null,
                               filtrosEmp.nivel !== 'Todos' ? filtrosEmp.nivel : null].filter(Boolean).join(' · ');

            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gray-50">
                    ${headerHtml(module.title, `Año: ${ULTIMO} · Población${filtroTxt ? ' (' + filtroTxt + ')' : ''}: ${Math.round(kpi.poblacion).toLocaleString('es-EC')}`)}

                    <div class="max-w-6xl mx-auto p-6">
                        <!-- Selector de segmento -->
                        <div class="flex gap-2 mb-4">
                            <button onclick="renderEnemduModule('enemdu')"
                                class="px-5 py-2 rounded-full font-bold text-sm transition ${isGeneral ? 'text-white' : 'bg-white text-gray-600 hover:bg-gray-100'}"
                                style="${isGeneral ? `background:${colors.navy}` : ''}">
                                🌎 Toda la PEA
                            </button>
                            <button onclick="renderEnemduModule('empleabilidad_superior')"
                                class="px-5 py-2 rounded-full font-bold text-sm transition ${!isGeneral ? 'text-white' : 'bg-white text-gray-600 hover:bg-gray-100'}"
                                style="${!isGeneral ? `background:${colors.navy}` : ''}">
                                🎓 Educación Superior
                            </button>
                        </div>

                        <!-- Filtros -->
                        <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-wrap gap-6">
                            ${selectHtml('Sexo', OPC_SEXO, filtrosEmp.sexo, `filtrosEmp.sexo=this.value;renderEnemduModule('${moduleKey}')`)}
                            ${selectHtml('Nivel de instrucción', [['Todos', 'Todos'], ...niveles.map(n => [n, n])], filtrosEmp.nivel, `filtrosEmp.nivel=this.value;renderEnemduModule('${moduleKey}')`)}
                        </div>

                        <!-- KPIs -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                            ${kpiHtml(fmt(kpi.desempleo) + '%', 'Tasa Desempleo', 'text-red-600', sub('desempleo', v => fmt(v) + '%'))}
                            ${kpiHtml(fmt(kpi.adecuado) + '%', 'Empleo Adecuado', 'text-green-600', sub('adecuado', v => fmt(v) + '%'))}
                            ${kpiHtml('$' + fmt(kpi.ingreso, 0), 'Ingreso Laboral', 'text-blue-600', sub('ingreso', v => '$' + fmt(v, 0)))}
                        </div>

                        <!-- Gráficos -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-1">Evolución ${ANIOS[0]}-${ULTIMO}</h3>
                                <p class="text-xs text-gray-500 mb-2">Línea continua: desempleo · punteada: empleo adecuado</p>
                                <div id="timeline-chart" style="height: 300px;"></div>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-4">Top 10 Provincias por Desempleo</h3>
                                <div id="provincia-chart" style="height: 300px;"></div>
                            </div>
                        </div>

                        <!-- Tabla Provincias -->
                        <div class="bg-white p-6 rounded-lg shadow">
                            <h3 class="text-lg font-bold mb-4">Detalle por Provincia (${ULTIMO})</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm">
                                    <thead class="bg-gray-100">
                                        <tr>
                                            <th class="px-4 py-2 text-left">Provincia</th>
                                            <th class="px-4 py-2 text-right">Desempleo %</th>
                                            <th class="px-4 py-2 text-right">Empleo Adecuado %</th>
                                            <th class="px-4 py-2 text-right">Ingreso Laboral</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${provincias.map(p => `
                                            <tr class="border-b hover:bg-gray-50">
                                                <td class="px-4 py-2">${p.provincia}</td>
                                                <td class="px-4 py-2 text-right">${celda(p, 'desempleo', 1)}</td>
                                                <td class="px-4 py-2 text-right">${celda(p, 'adecuado', 1)}</td>
                                                <td class="px-4 py-2 text-right">${celda(p, 'ingreso', 0, '$', '')}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                            ${notaN()}
                        </div>

                        <!-- Brecha de género -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-8">
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-4">Brecha de Género en Desempleo (${ULTIMO})</h3>
                                <p class="text-xs text-gray-500 mb-2">Puntos porcentuales, Mujer − Hombre, por grupo etario</p>
                                <div id="brecha-genero-chart" style="height: 280px;"></div>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-4">Desempleo por Sexo y Edad</h3>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-sm">
                                        <thead class="bg-gray-100">
                                            <tr>
                                                <th class="px-3 py-2 text-left">Grupo etario</th>
                                                <th class="px-3 py-2 text-right">Hombres %</th>
                                                <th class="px-3 py-2 text-right">Mujeres %</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${sexoEdad.map(g => `
                                                <tr class="border-b hover:bg-gray-50">
                                                    <td class="px-3 py-2">${g.grupo}</td>
                                                    <td class="px-3 py-2 text-right">${celda(g.Hombre, 'desempleo', 1)}</td>
                                                    <td class="px-3 py-2 text-right">${celda(g.Mujer, 'desempleo', 1)}</td>
                                                </tr>`).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Por nivel de instrucción -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-8">
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-4">Desempleo por Nivel de Instrucción (${ULTIMO})</h3>
                                <div id="nivel-instruccion-chart" style="height: 320px;"></div>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-4">Detalle por Nivel de Instrucción</h3>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-sm">
                                        <thead class="bg-gray-100">
                                            <tr>
                                                <th class="px-3 py-2 text-left">Nivel</th>
                                                <th class="px-3 py-2 text-right">Desempleo %</th>
                                                <th class="px-3 py-2 text-right">Empleo Adec. %</th>
                                                <th class="px-3 py-2 text-right">Sobrecalif. %</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${porNivel.map(n => `
                                                <tr class="border-b hover:bg-gray-50">
                                                    <td class="px-3 py-2">${n.nivel}</td>
                                                    <td class="px-3 py-2 text-right">${celda(n, 'desempleo', 1)}</td>
                                                    <td class="px-3 py-2 text-right">${celda(n, 'adecuado', 1)}</td>
                                                    <td class="px-3 py-2 text-right">${n.sobrecal ? celda(n, 'sobrecal', 1) : '—'}</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    ${footerHtml()}
                </div>
            `;

            setTimeout(() => {
                drawEvolucion('timeline-chart', cubo, base, [['desempleo', 'Desempleo'], ['adecuado', 'Empleo adecuado']]);
                const top = provincias.filter(p => p.n >= N_MIN).slice(0, 10).map(p => p.provincia).reverse();
                drawBarrasPorSexo('provincia-chart', cubo, base, top, c => ({ provincia: c, anio: ULTIMO }),
                    'desempleo', { horizontal: true, titulo: 'Tasa Desempleo %', margin: { l: 150, r: 20, t: 40, b: 40 } });
                drawBrechaGenero('brecha-genero-chart', base, grupos);
                drawBarrasPorSexo('nivel-instruccion-chart', cubo, base, niveles, c => ({ nivel: c, anio: ULTIMO }),
                    'desempleo', { titulo: 'Tasa Desempleo %', margin: { l: 50, r: 20, t: 40, b: 110 } });
            }, 100);
        }

        // Módulo Sobrecalificación (sólo graduados de educación superior)
        function renderSobrecalificacionModule() {
            const module = dashboardData.modules.sobrecalificacion;
            const base = { graduados: true, sexo: filtrosSob.sexo, provincia: filtrosSob.provincia };
            const kpi = m(cubo, { ...base, anio: ULTIMO });
            const kpiSexo = filtrosSob.sexo === 'Todos'
                ? SEXOS.map(s => [s, fmt(m(cubo, { ...base, sexo: s, anio: ULTIMO }).sobrecal) + '%']) : null;
            const provincias = [...new Set(cubo.map(r => r.provincia))].sort();

            // Distribución de graduados ocupados por gran grupo CIUO, en % del
            // total de la población filtrada (sexo/provincia): suma 100% por columna.
            const participacion = sexo => {
                const rows = filtrar(cuboOcup, { sexo, provincia: filtrosSob.provincia, anio: ULTIMO });
                const total = rows.reduce((a, r) => a + r.ocupados, 0);
                const out = {};
                rows.forEach(r => {
                    const o = out[r.ciuo_gran_grupo] ??= { ocupados: 0, n: 0, desc: r.ciuo_gran_grupo_desc };
                    o.ocupados += r.ocupados; o.n += r.n_muestral;
                });
                Object.values(out).forEach(o => { o.pct = total ? 100 * o.ocupados / total : null; });
                return out;
            };
            const partTotal = participacion(filtrosSob.sexo);
            const partSexo = filtrosSob.sexo === 'Todos' ? Object.fromEntries(SEXOS.map(s => [s, participacion(s)])) : null;
            const grupos = Object.keys(partTotal).map(Number).sort((a, b) => partTotal[b].pct - partTotal[a].pct);
            const celdaPct = o => !o ? '—' : `${o.n < N_MIN ? '<span class="text-gray-400">' : '<span>'}${fmt(o.pct)}%${o.n < N_MIN ? ' †' : ''}</span>`;

            const filtroTxt = [filtrosSob.sexo !== 'Todos' ? (filtrosSob.sexo === 'Hombre' ? 'Hombres' : 'Mujeres') : null,
                               filtrosSob.provincia !== 'Todas' ? filtrosSob.provincia : null].filter(Boolean).join(' · ');

            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gray-50">
                    ${headerHtml(module.title, 'Graduados en ocupaciones no acordes a su formación' + (filtroTxt ? ' · ' + filtroTxt : ''))}

                    <div class="max-w-6xl mx-auto p-6">
                        <!-- Filtros -->
                        <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-wrap gap-6">
                            ${selectHtml('Sexo', OPC_SEXO, filtrosSob.sexo, 'filtrosSob.sexo=this.value;renderSobrecalificacionModule()')}
                            ${selectHtml('Provincia', [['Todas', 'Todas (nacional)'], ...provincias.map(p => [p, p])], filtrosSob.provincia, 'filtrosSob.provincia=this.value;renderSobrecalificacionModule()')}
                        </div>

                        <!-- KPI Principal -->
                        <div class="mb-8">
                            ${kpiHtml(fmt(kpi.sobrecal) + '%' + (kpi.n < N_MIN ? ' †' : ''), `Tasa de Sobrecalificación (${ULTIMO})`, 'text-red-600 text-5xl', kpiSexo)}
                        </div>

                        <!-- Gráficos -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-4">Evolución ${ANIOS[0]}-${ULTIMO}</h3>
                                <div id="sobrecal-timeline-chart" style="height: 300px;"></div>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow">
                                <h3 class="text-lg font-bold mb-1">Por Ocupación (CIUO-08)</h3>
                                <p class="text-xs text-gray-500 mb-2">% de graduados ocupados en cada gran grupo · ⚠ = ocupación que no requiere título superior</p>
                                <div id="ocupacion-chart" style="height: 320px;"></div>
                            </div>
                        </div>

                        <!-- Tabla Ocupaciones -->
                        <div class="bg-white p-6 rounded-lg shadow">
                            <h3 class="text-lg font-bold mb-1">Detalle por Ocupación (${ULTIMO})</h3>
                            <p class="text-xs text-gray-500 mb-4">Distribución de los graduados ocupados: cada columna suma 100%.</p>
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm">
                                    <thead class="bg-gray-100">
                                        <tr>
                                            <th class="px-4 py-2 text-left">Ocupación (CIUO-08)</th>
                                            <th class="px-4 py-2 text-right">% Graduados ocupados</th>
                                            ${partSexo ? `<th class="px-4 py-2 text-right" style="color:${SEXO_COLOR.Hombre}">% Hombres</th>
                                                          <th class="px-4 py-2 text-right" style="color:${SEXO_COLOR.Mujer}">% Mujeres</th>` : ''}
                                            <th class="px-4 py-2 text-center">¿Sobrecalificado?</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${grupos.map(g => `
                                            <tr class="border-b hover:bg-gray-50">
                                                <td class="px-4 py-2">${partTotal[g].desc}</td>
                                                <td class="px-4 py-2 text-right">${celdaPct(partTotal[g])}</td>
                                                ${partSexo ? SEXOS.map(s => `<td class="px-4 py-2 text-right">${celdaPct(partSexo[s][g])}</td>`).join('') : ''}
                                                <td class="px-4 py-2 text-center">${g >= 4 ? '⚠️ Sí' : '—'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                            ${notaN()}
                        </div>
                    </div>
                    ${footerHtml()}
                </div>
            `;

            setTimeout(() => {
                drawEvolucion('sobrecal-timeline-chart', cubo, base, [['sobrecal', 'Sobrecalificación']]);
                drawOcupacion('ocupacion-chart', grupos.slice(0, 9).reverse(), partTotal, partSexo);
            }, 100);
        }

        // Gráficos
        function drawEvolucion(el, rows, base, indicadores) {
            const traces = [];
            indicadores.forEach(([k, label], i) => seriesSexo(base.sexo).forEach(s => traces.push({
                x: ANIOS,
                y: ANIOS.map(a => val(m(rows, { ...base, sexo: s, anio: a }), k)),
                name: `${label} · ${s === 'Hombre' ? 'Hombres' : 'Mujeres'}`,
                type: 'scatter', mode: 'lines+markers',
                line: { color: SEXO_COLOR[s], width: 3, dash: i ? 'dot' : 'solid' }
            })));
            Plotly.newPlot(el, traces, {
                margin: { l: 50, r: 20, t: 10, b: 30 }, hovermode: 'x unified',
                yaxis: { ticksuffix: '%' }, xaxis: { dtick: 1 },
                legend: { orientation: 'h', y: -0.15 }
            }, { responsive: true });
        }

        // Barras agrupadas por sexo (o una sola serie si hay filtro de sexo)
        function drawBarrasPorSexo(el, rows, base, categorias, filtroCat, k, opts) {
            const h = !!opts.horizontal;
            const traces = seriesSexo(base.sexo).map(s => {
                const valores = categorias.map(c => val(m(rows, { ...base, sexo: s, ...filtroCat(c) }), k));
                return {
                    type: 'bar', name: s === 'Hombre' ? 'Hombres' : 'Mujeres', orientation: h ? 'h' : 'v',
                    x: h ? valores : categorias, y: h ? categorias : valores,
                    marker: { color: SEXO_COLOR[s] }
                };
            });
            Plotly.newPlot(el, traces, {
                barmode: 'group', margin: opts.margin,
                legend: { orientation: 'h', y: 1, yanchor: 'bottom' },
                [h ? 'xaxis' : 'yaxis']: { title: opts.titulo, ticksuffix: '%' },
                ...(h ? {} : { xaxis: { tickangle: -35 } })
            }, { responsive: true });
        }

        function drawBrechaGenero(el, base, grupos) {
            const brechas = grupos.map(g => {
                const h = m(cubo, { ...base, sexo: 'Hombre', grupo_edad: g, anio: ULTIMO });
                const mu = m(cubo, { ...base, sexo: 'Mujer', grupo_edad: g, anio: ULTIMO });
                return h.n >= N_MIN && mu.n >= N_MIN ? mu.desempleo - h.desempleo : null;
            });
            Plotly.newPlot(el, [{
                x: grupos, y: brechas, type: 'bar',
                marker: { color: brechas.map(b => b >= 0 ? SEXO_COLOR.Mujer : SEXO_COLOR.Hombre) }
            }], {
                margin: { l: 50, r: 20, t: 20, b: 30 },
                yaxis: { title: 'p.p. (Mujer − Hombre)', zeroline: true },
                shapes: [{ type: 'line', x0: -0.5, x1: grupos.length - 0.5, y0: 0, y1: 0, line: { color: '#999', width: 1 } }]
            }, { responsive: true });
        }

        function drawOcupacion(el, grupos, partTotal, partSexo) {
            // Etiquetas CIUO largas: salto de línea en el primer espacio pasado el carácter 20
            const etiqueta = g => ((g >= 4 ? '⚠ ' : '') + partTotal[g].desc).replace(/^(.{20,}?) /, '$1<br>');
            const series = partSexo ? SEXOS.map(s => [s === 'Hombre' ? 'Hombres' : 'Mujeres', partSexo[s], SEXO_COLOR[s]])
                                    : [[filtrosSob.sexo === 'Hombre' ? 'Hombres' : 'Mujeres', partTotal, SEXO_COLOR[filtrosSob.sexo]]];
            Plotly.newPlot(el, series.map(([nombre, part, color]) => ({
                type: 'bar', orientation: 'h', name: nombre,
                y: grupos.map(etiqueta),
                x: grupos.map(g => part[g] && part[g].n >= N_MIN ? part[g].pct : null),
                marker: { color }
            })), {
                barmode: 'group', margin: { l: 10, r: 20, t: 40, b: 40 },
                legend: { orientation: 'h', y: 1, yanchor: 'bottom' },
                yaxis: { automargin: true },
                xaxis: { title: '% de graduados ocupados', ticksuffix: '%' }
            }, { responsive: true });
        }

        // Iniciar
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
